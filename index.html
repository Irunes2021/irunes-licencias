<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CC Irunés · Licencias</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #e0e0e0;
    --accent: #1a3a5c;
    --cat-cadete: #e67e22;
    --cat-junior: #c0392b;
    --text: #1a1a1a;
    --muted: #888;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  .login-box {
    background: var(--surface); border-radius: 16px; padding: 2.5rem;
    width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 1.5rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .login-logo { text-align: center; }
  .login-logo span { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
  .login-logo h1 { font-size: 1.4rem; font-weight: 600; color: var(--accent); margin-top: 0.4rem; }
  .login-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
  .login-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem; color: var(--text);
    font-size: 1.2rem; letter-spacing: 0.2em; outline: none; text-align: center;
  }
  .login-btn {
    width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); padding: 1rem; font-weight: 600; font-size: 1rem; cursor: pointer;
  }
  .login-error { color: #c0392b; font-size: 0.85rem; text-align: center; display: none; }

  /* APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--accent); color: #fff;
    padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .header-title { font-size: 1rem; font-weight: 600; }
  .header-sub { font-size: 0.75rem; opacity: 0.7; margin-top: 0.1rem; }
  .logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 0.8rem; cursor: pointer; }

  /* TABS */
  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 60px; z-index: 9; }
  .tab {
    flex: 1; padding: 1rem; text-align: center; font-weight: 600; font-size: 0.95rem;
    cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); transition: all 0.2s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab[data-cat="cadete"].active { color: var(--cat-cadete); border-bottom-color: var(--cat-cadete); }
  .tab[data-cat="junior"].active { color: var(--cat-junior); border-bottom-color: var(--cat-junior); }

  /* CONTENT */
  .content { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }

  /* SECTION */
  .section-title {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--muted); padding: 0 0.5rem; margin-top: 0.5rem;
  }

  /* CARD */
  .card {
    background: var(--surface); border-radius: var(--radius);
    padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card-info { flex: 1; }
  .card-name { font-weight: 600; font-size: 1rem; }
  .card-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
  .card-btns { display: flex; gap: 0.5rem; flex-shrink: 0; margin-left: 1rem; }
  .lic-btn {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 10px; font-weight: 700;
    font-size: 0.9rem; text-decoration: none; color: #fff;
    background: var(--accent);
  }
  .lic-btn.b { background: var(--accent); opacity: 0.75; }
  .no-lic { font-size: 0.8rem; color: var(--muted); font-style: italic; }

  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; font-size: 0.9rem; }

  .badge-entrenador {
    display: inline-block; background: #eaf4fb; color: #1a6fa0;
    border: 1px solid #85c1e9; border-radius: 10px; font-size: 0.65rem;
    padding: 0.1rem 0.5rem; margin-top: 0.2rem; font-weight: 600; letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <span>Club Ciclista Irunés</span>
      <h1>Licencias</h1>
    </div>
    <div>
      <div class="login-label">Email</div>
      <input type="email" class="login-input" id="login-email" placeholder="tu@ccirunes.com" />
    </div>
    <div>
      <div class="login-label">Contraseña</div>
      <input type="password" class="login-input" id="login-input" placeholder="••••••" maxlength="20" />
    </div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error">Email o contraseña incorrectos</div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div>
      <div class="header-title">CC Irunés · Licencias</div>
      <div class="header-sub" id="header-sub">—</div>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem">
      <select id="sel-temporada" onchange="cambiarTemporada()"
        style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:.35rem .5rem;font-family:inherit;font-size:.78rem;outline:none"></select>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-cat="cadete" onclick="setTab('cadete')">🟠 Cadetes</div>
    <div class="tab" data-cat="junior" onclick="setTab('junior')">🔴 Juniors</div>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
  const SUPABASE_URL = 'https://dbydtwkzknbpifneznsu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRieWR0d2t6a25icGlmbmV6bnN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMjMwODIsImV4cCI6MjA5MDc5OTA4Mn0.HcTWBEaI-2EH66mAUAaEM2ppzDG3eCd1ANjopNZdt1g';
  const STORAGE = 'https://dbydtwkzknbpifneznsu.supabase.co/storage/v1/object/public/Licencias';

  // ─── SESIÓN SUPABASE AUTH ────────────────────────────────────
  const SS_KEY = 'cc_licencias_session';
  const REFRESH_MS = 50 * 60 * 1000; // 50 min
  let miRol = null;
  let refreshTimer = null;

  function getSesion() {
    try { return JSON.parse(localStorage.getItem(SS_KEY)); } catch { return null; }
  }
  function guardarSesion(s) { localStorage.setItem(SS_KEY, JSON.stringify(s)); }
  function borrarSesion() { localStorage.removeItem(SS_KEY); miRol = null; }

  async function authPassword(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error('Credenciales incorrectas');
    return res.json();
  }

  async function authRefresh(refresh_token) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token })
    });
    if (!res.ok) throw new Error('No se pudo refrescar la sesión');
    return res.json();
  }

  function programarRefresco() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(async () => {
      const s = getSesion();
      if (!s) return;
      try {
        const nueva = await authRefresh(s.refresh_token);
        guardarSesion(nueva);
      } catch {
        borrarSesion();
        mostrarLogin();
      }
    }, REFRESH_MS);
  }
  // ────────────────────────────────────────────────────────────

  // ─── TEMPORADA ──────────────────────────────────────────────
  // La temporada en curso se calcula sola: empieza el 1 de octubre.
  // Ya no hay que tocar nada cada año.
  const MES_INICIO_TEMPORADA = 10;   // octubre

  function temporadaEnCurso(hoy = new Date()) {
    const a = hoy.getFullYear();
    return (hoy.getMonth() + 1) >= MES_INICIO_TEMPORADA
      ? `${a}-${a + 1}`
      : `${a - 1}-${a}`;
  }

  let TEMPORADAS = [];
  let TEMPORADA = temporadaEnCurso();
  // ────────────────────────────────────────────────────────────

  let corredores = [];
  let entrenadores = [];
  let tabActual = 'cadete';

  function mostrarLogin() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-input').value = '';
  }

  async function entrarApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    await cargarTemporadas();
    loadData();
  }

  async function cargarTemporadas() {
    try {
      const filas = await sbRpc('temporadas_corredores');
      TEMPORADAS = (filas || []).map(f => f.temporada);
    } catch (e) { console.error(e); TEMPORADAS = []; }

    // La temporada en curso siempre aparece, aunque aún no tenga datos
    const actual = temporadaEnCurso();
    if (!TEMPORADAS.includes(actual)) TEMPORADAS.unshift(actual);
    TEMPORADAS.sort().reverse();

    if (!TEMPORADAS.includes(TEMPORADA)) TEMPORADA = TEMPORADAS[0];

    document.getElementById('sel-temporada').innerHTML = TEMPORADAS.map(t =>
      `<option value="${t}"${t === TEMPORADA ? ' selected' : ''}>${t}</option>`).join('');
  }

  async function cambiarTemporada() {
    TEMPORADA = document.getElementById('sel-temporada').value;
    await loadData();
  }

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-input').value;
    document.getElementById('login-error').style.display = 'none';
    try {
      const sesion = await authPassword(email, password);
      guardarSesion(sesion);
      const perfil = await sbRpc('mi_perfil');
      const rol = perfil && perfil[0] && perfil[0].rol;
      if (rol !== 'admin' && rol !== 'coordinador_escuela') {
        borrarSesion();
        throw new Error('Sin permiso para esta app');
      }
      miRol = rol;
      programarRefresco();
      entrarApp();
    } catch (e) {
      borrarSesion();
      document.getElementById('login-error').style.display = 'block';
    }
  }
  document.getElementById('login-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  function doLogout() {
    if (refreshTimer) clearInterval(refreshTimer);
    borrarSesion();
    mostrarLogin();
  }

  async function intentarSesionGuardada() {
    const s = getSesion();
    if (!s) return false;
    try {
      const nueva = await authRefresh(s.refresh_token);
      guardarSesion(nueva);
      const perfil = await sbRpc('mi_perfil');
      const rol = perfil && perfil[0] && perfil[0].rol;
      if (rol !== 'admin' && rol !== 'coordinador_escuela') { borrarSesion(); return false; }
      miRol = rol;
      programarRefresco();
      return true;
    } catch {
      borrarSesion();
      return false;
    }
  }

  async function sbRpc(fn, args) {
    const s = getSesion();
    const token = s ? s.access_token : SUPABASE_KEY;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args || {})
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function sbFetch(path) {
    const s = getSesion();
    const token = s ? s.access_token : SUPABASE_KEY;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
    });
    return res.json();
  }

  async function loadData() {
    [corredores, entrenadores] = await Promise.all([
      sbFetch(`corredores?select=nombre,apellido1,apellido2,categoria,licencia_nombre,num_licencia&activo=eq.true&temporada=eq.${encodeURIComponent(TEMPORADA)}&order=apellido1.asc`),
      sbFetch(`entrenadores?select=nombre,apellido1,apellido2,categoria,licencia_nombre&activo=eq.true&temporada=eq.${encodeURIComponent(TEMPORADA)}&order=apellido1.asc`)
    ]);
    renderTab();
  }

  function setTab(cat) {
    tabActual = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-cat="${cat}"]`).classList.add('active');
    renderTab();
  }

  function licBtns(nombre) {
    if (!nombre) return '<span class="no-lic">Sin licencia</span>';
    return `
      <a href="${STORAGE}/${nombre}1.png" target="_blank" class="lic-btn">A</a>
      <a href="${STORAGE}/${nombre}2.png" target="_blank" class="lic-btn b">B</a>`;
  }

  function renderTab() {
    const cat = tabActual;
    const label = cat === 'cadete' ? 'Cadetes' : 'Juniors';
    document.getElementById('header-sub').textContent = label + ' · ' + TEMPORADA;

    const tecnicos = entrenadores.filter(e => e.categoria === cat);
    const riders = corredores.filter(c => c.categoria === cat);

    let html = '';

    // Entrenadores
    if (tecnicos.length > 0) {
      html += '<div class="section-title">Técnicos</div>';
      tecnicos.forEach(e => {
        const nomTec = [e.apellido1, e.apellido2].filter(Boolean).join(' ');
        const etiqueta = nomTec ? `${nomTec}, ${e.nombre || ''}` : (e.nombre || '');
        html += `<div class="card">
          <div class="card-info">
            <div class="card-name">${etiqueta}</div>
            <div><span class="badge-entrenador">TÉCNICO</span></div>
          </div>
          <div class="card-btns">${licBtns(e.licencia_nombre)}</div>
        </div>`;
      });
    }

    // Corredores
    html += '<div class="section-title">Corredores</div>';
    if (riders.length === 0) {
      html += '<div class="empty">No hay corredores en esta categoría</div>';
    } else {
      riders.forEach(c => {
        const nombre = `${c.apellido1 || ''} ${c.apellido2 || ''}, ${c.nombre || ''}`;
        const sub = c.num_licencia ? `Lic: ${c.num_licencia}` : '';
        html += `<div class="card">
          <div class="card-info">
            <div class="card-name">${nombre}</div>
            ${sub ? `<div class="card-sub">${sub}</div>` : ''}
          </div>
          <div class="card-btns">${licBtns(c.licencia_nombre)}</div>
        </div>`;
      });
    }

    document.getElementById('content').innerHTML = html;
  }

  // Si ya hay sesión abierta en otra app del grupo, entrar directo
  // Si hay una sesión Supabase Auth guardada y sigue siendo válida, entrar directo
  intentarSesionGuardada().then(ok => { if (ok) entrarApp(); });
</script>
</body>
</html>
